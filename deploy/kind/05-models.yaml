# REAL llama.cpp replicas: where the model file comes from.
#
# The namespace enforces the restricted Pod Security Standard, which forbids
# hostPath volumes in pods, so the pods mount this claim read-only instead.
# Behind it is a directory on the node, which scripts/up.ps1 fills by
# copying the pinned GGUF into the node container and checking its SHA-256
# (the same hash scripts/setup-llama.ps1 pins).
#
# One node, so the path is on that node and the claim is ReadOnlyMany: all
# four replicas mount the same file at once.
#
# storageClassName: "" on both sides, and volumeName/claimRef naming each
# other, so this pair binds to each other and never to a volume the default
# local-path provisioner would make.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tenantscaler-llama-models
  labels:
    app.kubernetes.io/part-of: tenantscaler
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/tenantscaler/models
    type: Directory
  claimRef:
    namespace: tenantscaler
    name: llama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-models
  namespace: tenantscaler
  labels:
    app.kubernetes.io/part-of: tenantscaler
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""
  volumeName: tenantscaler-llama-models
  resources:
    requests:
      storage: 1Gi
