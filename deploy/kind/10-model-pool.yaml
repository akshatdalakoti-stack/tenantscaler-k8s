# REAL llama.cpp replicas: the pool TenantScaler actually scales.
#
# Same Deployment name and labels as deploy/k8s/10-model-pool.yaml, so the
# Service, the gateway's EndpointSlice discovery and the controller's
# deployments/scale all keep working untouched; this file only swaps the
# simulated engine for real inference. Apply it after deploy/k8s/.
#
# Image: the official llama.cpp server image, build b11913, pinned by
# digest. The bare-metal measurements in results/real/ used b11898, which
# has no published image; the two builds are days apart.
#
# Each pod: 2 CPUs requested AND limited, so the pod is Guaranteed QoS and
# cannot be throttled by its neighbours; -t 2 matches the limit, 4 slots of
# 1024 tokens (-c 4096 -np 4) match engine.maxNumSeqs in 15-config.yaml, and
# --cache-ram 0 turns off the prompt cache so a repeated prompt is not
# served from an earlier request's work. A budget of 4 is 8 of this
# laptop's 12 CPUs, leaving the gateway, controller, dashboard and the three
# tenant pods the rest.
#
# spec.replicas is deliberately absent: the controller owns the replica
# count through deployments/scale, so re-applying this file must not reset
# it. Recreate, never a rolling update: simulated and llama pods must never
# sit behind the one Service together.
#
# /health answers 503 while the model loads, so the startup probe waits for
# it (up to 120 s) and the readiness probe only then takes over. The
# controller counts a not-ready pod as "starting", which is exactly the cold
# start its stabiliser is there to absorb. preStop keeps the pod serving for
# 20 s while discovery drops it, then SIGTERM drains the rest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-pool
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: model-pool
    app.kubernetes.io/part-of: tenantscaler
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-pool
        app.kubernetes.io/part-of: tenantscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: replica
          image: ghcr.io/ggml-org/llama.cpp@sha256:989a1a193343d5e361e14b666e316186ab48be0152cf0a34b30e3c0648ee944f
          imagePullPolicy: IfNotPresent
          args: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "-ngl", "0", "-t", "2", "-c", "4096", "-np", "4",
                 "--metrics", "--host", "0.0.0.0", "--port", "8000", "--cache-ram", "0"]
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep:
                seconds: 20
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
            readOnly: true
        - name: tmp
          emptyDir: {}
