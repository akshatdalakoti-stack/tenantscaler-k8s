# The tenant-fair gateway: the fast loop. It discovers ready model-pool
# replicas from the Service's EndpointSlices and dispatches to pods
# directly, enforcing the controller's per-tenant policy on every request.
#
# One replica, and Recreate rather than a rolling update: the fairness state
# (per-tenant virtual token counters and queues) lives in memory, so two
# gateways behind one Service would split it, and the controller's /stats
# and /policy would hit one or the other at random.
#
# Tenants: with -k8s-service it reads them from the TenantScalers of its
# pool (tenant = resource name; re-read every 30 s) when its Role may list
# them, and otherwise falls back to the mounted config file. It answers 400
# to a tenant it does not know. Either way the file and the TenantScalers
# must agree, so both read 15-config.yaml, which the controller and the
# simulated replicas mount too. After editing it:
#   kubectl -n tenantscaler rollout restart deployment gateway
#
# Keys: $TS_TENANT_KEYS (which key is which tenant) and $TS_ADMIN_KEY
# (POST/GET /policy, /stats, /metrics) come from the Secret
# tenantscaler-keys, which scripts/keys.ps1 or scripts/keys.sh generates
# outside the repository and nothing commits. Keys are read at start, so
# restart the gateway and the controller after changing the Secret. With an
# admin key set, /metrics needs the bearer token too, so a Prometheus
# scraping through the annotations below must send it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: tenantscaler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: tenantscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: tenantscaler:dev
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - -addr
            - :8080
            - -config
            - /etc/tenantscaler/config.yaml
            - -mode
            - fair
            - -namespace
            - tenantscaler
            - -k8s-service
            - model-pool
            - -k8s-port
            - "8000"
          env:
            - name: TS_TENANT_KEYS
              valueFrom:
                secretKeyRef:
                  name: tenantscaler-keys
                  key: TS_TENANT_KEYS
            - name: TS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: tenantscaler-keys
                  key: TS_ADMIN_KEY
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/tenantscaler
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: tenantscaler-config
---
# NodePort 30081, which deploy/kind/kind-config.yaml maps to 127.0.0.1:8081
# on the host, so you can drive the cluster's gateway from your own shell:
#   tenantscaler loadgen -gateway http://127.0.0.1:8081 -key <key> -profile spike
# The in-cluster tenants of 60-tenant-load.yaml use the ClusterIP instead.
# Every request needs a tenant key, so the port is keyed, not open.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: tenantscaler
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
