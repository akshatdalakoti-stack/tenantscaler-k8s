# The TenantScaler controller: the slow loop, one cycle every 10 s. It reads
# the TenantScalers of pool shared-llm-pool, the gateway's per-tenant stats
# and the model-pool Deployment; then it arbitrates the budget, scales the
# Deployment through deployments/scale, pushes a versioned policy to the
# gateway and writes each tenant's outcome into its TenantScaler status.
#
# Exactly one replica (single writer, no leader election), recreated rather
# than rolled. It serves /decisions, /status, /healthz and /metrics on 8090.
# /healthz answers as soon as the process listens, including while it waits
# (retrying every cycle) for its first TenantScalers; the others answer 503
# until then. A cycle whose gateway stats or Deployment status cannot be
# read FAILS STATIC: nothing is scaled, the error shows in /status and
# tenantscaler_controller_failstatic_total counts it. After a restart it
# continues the policy versions the gateway (GET /policy) and the
# TenantScaler statuses already hold, so the gateway applies its policies
# instead of discarding them as older than what it has.
#
# -config is 15-config.yaml, the same file the gateway and the simulated
# replicas mount, so the dispatch window, the cycle, the per-replica
# capacity and the tenant set cannot drift apart between the two loops.
# -pool and -capacity restate what that file already says, because the
# KEDA and HPA baselines in k8s/baselines are sized from them and read them
# here; internal/k8s tests fail if the two disagree.
#
# The root filesystem is read-only, so there is no decision log file
# (-decisions-file ""): read the log from /decisions and each tenant's
# latest outcome from its TenantScaler status.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantscaler-controller
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: tenantscaler-controller
    app.kubernetes.io/part-of: tenantscaler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tenantscaler-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenantscaler-controller
        app.kubernetes.io/part-of: tenantscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: tenantscaler-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: tenantscaler:dev
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - -addr
            - :8090
            - -config
            - /etc/tenantscaler/config.yaml
            - -k8s
            - -namespace
            - tenantscaler
            - -deployment
            - model-pool
            - -pool
            - shared-llm-pool
            - -capacity
            - "4"
            - -gateway
            - http://gateway:8080
            - -decisions-file
            - ""
          env:
            - name: TS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: tenantscaler-keys
                  key: TS_ADMIN_KEY
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: config
              mountPath: /etc/tenantscaler
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: tenantscaler-config
---
# NodePort 30090 -> 127.0.0.1:18090 on the host (deploy/kind/kind-config.yaml),
# so you can read the controller's reasoning straight from your own shell:
#   curl -s 127.0.0.1:18090/decisions | python -m json.tool
# These endpoints are read-only and unauthenticated (the admin key is only
# something the controller SENDS to the gateway), so they stay on a
# node port bound to 127.0.0.1 and nothing else.
apiVersion: v1
kind: Service
metadata:
  name: tenantscaler-controller
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: tenantscaler-controller
    app.kubernetes.io/part-of: tenantscaler
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tenantscaler-controller
  ports:
    - name: http
      port: 8090
      targetPort: http
      nodePort: 30090
