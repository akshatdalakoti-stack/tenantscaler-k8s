# The shared model pool, SIMULATED: identical replicas running the engine
# latency model instead of a real one. This is the fallback that needs no
# downloads; deploy/kind/10-model-pool.yaml replaces it, under the same name
# and labels, with real llama.cpp pods. The engine parameters come from
# 15-config.yaml, so a simulated run uses the model calibrated against the
# real replica rather than the built-in GPU-like default.
# spec.replicas is deliberately omitted: the TenantScaler controller owns the
# replica count (through deployments/scale), so re-applying this file must not
# reset it. The readiness probe stays false while a replica cold-starts
# (simulated model load), which is what the controller counts as "starting".
# Scale-down is graceful: the preStop sleep keeps the pod serving while its
# endpoint turns not-ready and the gateway's EndpointSlice discovery drops it;
# then SIGTERM drains in-flight requests (up to 30 s, see `tenantscaler
# replica`) inside the 45 s grace period. preStop sleep needs Kubernetes 1.30+.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-pool
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: model-pool
    app.kubernetes.io/part-of: tenantscaler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: model-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-pool
        app.kubernetes.io/part-of: tenantscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: replica
          image: tenantscaler:dev
          imagePullPolicy: IfNotPresent
          args: ["replica", "-addr", ":8000", "-config", "/etc/tenantscaler/config.yaml"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/tenantscaler
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: tenantscaler-config
---
apiVersion: v1
kind: Service
metadata:
  name: model-pool
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: model-pool
    app.kubernetes.io/part-of: tenantscaler
spec:
  selector:
    app.kubernetes.io/name: model-pool
  ports:
    - name: http
      port: 8000
      targetPort: http
