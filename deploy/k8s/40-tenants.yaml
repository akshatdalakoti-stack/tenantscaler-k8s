# The worked example, sized for ONE PC: three tenants share a budget of 4
# replicas, each guaranteed 1 (3 <= 4, so the promise is keepable) and
# allowed to borrow up to 3.
#
# A tenant's name is its fairness id. Requests carry it as
#   x-llm-d-inference-fairness-id: a | b | c
# though in practice the gateway derives it from the request's API key, so a
# tenant cannot claim to be another one by setting the header.
#
# c is the noisy neighbour: same guarantee, same cap, but priority 50
# against a and b's 100. Priority orders only who borrows a spare replica
# first, so when c's spike arrives a and b take the spare before it does and
# c runs into its cap of 3. The arbiter then marks c shedding, the gateway
# answers c's sheddable requests with 429 and a Retry-After, and a's and b's
# guaranteed replica is never lent out from under them.
#
# 15-config.yaml must list exactly these tenants with exactly these specs;
# internal/k8s tests compare the two. Change them together.
apiVersion: scaling.tenantscaler.dev/v1alpha1
kind: TenantScaler
metadata:
  name: a
  namespace: tenantscaler
spec:
  pool: shared-llm-pool
  guaranteedReplicas: 1
  maxReplicas: 3
  priority: 100
  slo:
    ttftSeconds: 2
    tpotMillis: 200
    targetFraction: 0.99
---
apiVersion: scaling.tenantscaler.dev/v1alpha1
kind: TenantScaler
metadata:
  name: b
  namespace: tenantscaler
spec:
  pool: shared-llm-pool
  guaranteedReplicas: 1
  maxReplicas: 3
  priority: 100
  slo:
    ttftSeconds: 2
    tpotMillis: 200
    targetFraction: 0.99
---
apiVersion: scaling.tenantscaler.dev/v1alpha1
kind: TenantScaler
metadata:
  name: c
  namespace: tenantscaler
spec:
  pool: shared-llm-pool
  guaranteedReplicas: 1
  maxReplicas: 3
  priority: 50
  slo:
    ttftSeconds: 2
    tpotMillis: 200
    targetFraction: 0.99
